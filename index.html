<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specbot</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #131314;
      --sidebar: #1e1f20;
      --surface: #1e1f20;
      --surface-hover: #282a2c;
      --border: #333537;
      --text: #e3e3e3;
      --muted: #9aa0a6;
      --accent: #a8c7fa;
      --accent-bg: #004a77;
      --danger: #f28b82;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Google Sans", Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Login screen */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.28s ease;
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 500;
    }

    .login-card p {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .google-btn-wrap {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    .login-error {
      margin-top: 16px;
      font-size: 13px;
      color: var(--danger);
      min-height: 18px;
    }

    /* Main Gemini-like app */
    .app {
      display: none;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .app.active {
      display: flex;
    }

    .sidebar {
      width: 270px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      gap: 16px;
      flex-shrink: 0;
    }

    .new-chat-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: #282a2c;
      color: var(--text);
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .new-chat-btn:hover {
      background: #333537;
    }

    .section-label {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .skill-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .skill-item {
      border: none;
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      text-align: left;
      font-size: 13.5px;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .skill-item:hover {
      background: var(--surface-hover);
    }

    .skill-item.active {
      background: var(--accent-bg);
      color: #d3e3fd;
      font-weight: 500;
    }

    .lang-select {
      width: 100%;
      background: #282a2c;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13.5px;
      outline: none;
      cursor: pointer;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .user-info {
      overflow: hidden;
    }

    .user-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .logout-btn:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    /* Main chat column */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    .topbar {
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .active-badge {
      font-size: 12px;
      color: var(--accent);
      background: rgba(168, 199, 250, 0.1);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .menu-toggle {
      display: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .messages-inner {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .greeting {
      margin: 48px auto 12px;
      text-align: center;
      max-width: 540px;
      animation: fadeIn 0.35s ease;
    }

    .greeting h2 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 500;
      background: linear-gradient(90deg, #a8c7fa, #d3e3fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .greeting p {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.22s ease;
    }

    .msg-user {
      align-self: flex-end;
      max-width: 80%;
      background: #282a2c;
      color: var(--text);
      padding: 12px 18px;
      border-radius: 20px 20px 6px 20px;
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-bot {
      align-self: flex-start;
      width: 100%;
      padding: 4px 0;
      font-size: 14.5px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-error {
      color: var(--danger);
      background: rgba(242, 139, 130, 0.1);
      border: 1px solid rgba(242, 139, 130, 0.3);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13.5px;
    }

    .msg-actions {
      margin-top: 6px;
      display: flex;
      gap: 8px;
    }

    .copy-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .dots {
      display: inline-flex;
      gap: 5px;
      padding: 8px 2px;
    }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulseDot 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulseDot {
      0%, 80%, 100% { transform: scale(0.75); opacity: 0.4; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input bar */
    .composer-wrap {
      padding: 0 20px 22px;
    }

    .composer-box {
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 10px 14px 10px 20px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .composer-box:focus-within {
      border-color: var(--accent);
      background: #232527;
    }

    textarea {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      resize: none;
      max-height: 160px;
      outline: none;
      padding: 6px 0;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      border: none;
      background: var(--accent);
      color: #062e6f;
      font-weight: 600;
      font-size: 13.5px;
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      transform: scale(1.03);
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 30;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: inline-block;
      }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1>Specbot</h1>
      <p>Connexion réservée aux comptes Google autorisés par l'administrateur.</p>
      <div class="google-btn-wrap" id="googleBtnContainer"></div>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div class="app" id="appShell">
    <aside class="sidebar" id="sidebar">
      <button type="button" class="new-chat-btn" id="newChatBtn">+ Nouvelle discussion</button>

      <div>
        <div class="section-label">Skill</div>
        <div class="skill-list" id="skillList">
          <button type="button" class="skill-item active" data-skill="full_presales">Parcours complet</button>
          <button type="button" class="skill-item" data-skill="qualification">Qualification & Cross-sell</button>
          <button type="button" class="skill-item" data-skill="objections">Objections & Arguments</button>
          <button type="button" class="skill-item" data-skill="specs">Specs techniques</button>
        </div>
      </div>

      <div>
        <div class="section-label">Langue</div>
        <select class="lang-select" id="langSelect">
          <option value="FR">Français (FR)</option>
          <option value="EN">English (EN)</option>
          <option value="ES">Español (ES)</option>
          <option value="IT">Italiano (IT)</option>
          <option value="DE">Deutsch (DE)</option>
        </select>
      </div>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-name" id="userName">Agent</div>
          <div class="user-email" id="userEmail"></div>
        </div>
        <button type="button" class="logout-btn" id="logoutBtn">Quitter</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <button type="button" class="menu-toggle" id="menuToggle">Menu</button>
          <span>Specbot</span>
          <span class="active-badge" id="activeBadge">Parcours complet · FR</span>
        </div>
      </header>

      <div class="messages" id="messagesScroll">
        <div class="messages-inner" id="messagesInner">
          <div class="greeting" id="greetingBlock">
            <h2>Bonjour, comment puis-je aider ?</h2>
            <p>Colle une question client, un EAN ou une référence produit.</p>
          </div>
        </div>
      </div>

      <div class="composer-wrap">
        <form class="composer-box" id="chatForm">
          <textarea
            id="promptInput"
            rows="1"
            placeholder="Pose ta question ou colle le message client..."
          ></textarea>
          <button type="submit" class="send-btn" id="sendBtn">Envoyer</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    const state = {
      user: null,
      skill: "full_presales",
      skillName: "Parcours complet",
      language: "FR",
      history: []
    };

    const loginScreen = document.getElementById("loginScreen");
    const appShell = document.getElementById("appShell");
    const loginError = document.getElementById("loginError");
    const messagesScroll = document.getElementById("messagesScroll");
    const messagesInner = document.getElementById("messagesInner");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatForm = document.getElementById("chatForm");
    const activeBadge = document.getElementById("activeBadge");
    const sidebar = document.getElementById("sidebar");

    function updateBadge() {
      activeBadge.textContent = `${state.skillName} · ${state.language}`;
    }

    function showApp(user) {
      state.user = user;
      document.getElementById("userName").textContent = user.name || user.email;
      document.getElementById("userEmail").textContent = user.email;
      loginScreen.style.display = "none";
      appShell.classList.add("active");
      updateBadge();
      promptInput.focus();
    }

    function showLogin(errMsg = "") {
      state.user = null;
      appShell.classList.remove("active");
      loginScreen.style.display = "flex";
      loginError.textContent = errMsg;
    }

    async function handleGoogleCredential(response) {
      loginError.textContent = "";
      try {
        const res = await fetch("/api/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok) {
          showLogin(data.error || "Connexion refusée");
          return;
        }
        showApp(data.user);
      } catch (err) {
        showLogin("Erreur réseau : " + err.message);
      }
    }

    function initGoogleSignIn() {
      const render = () => {
        if (!window.google?.accounts?.id) {
          setTimeout(render, 120);
          return;
        }
        // Fetch public client id from a lightweight check or pass via meta/endpoint if needed
        fetch("/api/auth/config")
          .then((r) => r.json())
          .then(({ clientId }) => {
            if (!clientId) {
              loginError.textContent = "GOOGLE_CLIENT_ID non configuré sur le serveur.";
              return;
            }
            window.google.accounts.id.initialize({
              client_id: clientId,
              callback: handleGoogleCredential
            });
            window.google.accounts.id.renderButton(
              document.getElementById("googleBtnContainer"),
              { theme: "filled_black", size: "large", width: 280, text: "signin_with" }
            );
          })
          .catch(() => {
            loginError.textContent = "Impossible de charger la configuration Google.";
          });
      };
      render();
    }

    async function checkSession() {
      try {
        const res = await fetch("/api/auth/me");
        if (res.ok) {
          const data = await res.json();
          showApp(data.user);
          return;
        }
      } catch {}
      showLogin();
      initGoogleSignIn();
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      state.history = [];
      showLogin();
      initGoogleSignIn();
    });

    document.getElementById("menuToggle").addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    document.getElementById("skillList").addEventListener("click", (e) => {
      const btn = e.target.closest(".skill-item");
      if (!btn) return;
      document.querySelectorAll(".skill-item").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.skill = btn.dataset.skill;
      state.skillName = btn.textContent.trim();
      updateBadge();
      sidebar.classList.remove("open");
    });

    document.getElementById("langSelect").addEventListener("change", (e) => {
      state.language = e.target.value;
      updateBadge();
    });

    function resetConversation() {
      state.history = [];
      messagesInner.innerHTML = `
        <div class="greeting" id="greetingBlock">
          <h2>Bonjour, comment puis-je aider ?</h2>
          <p>Colle une question client, un EAN ou une référence produit.</p>
        </div>
      `;
    }

    document.getElementById("newChatBtn").addEventListener("click", () => {
      resetConversation();
      sidebar.classList.remove("open");
    });

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + "px";
    });

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    function removeGreeting() {
      const g = document.getElementById("greetingBlock");
      if (g) g.remove();
    }

    function appendUserMessage(text) {
      removeGreeting();
      const row = document.createElement("div");
      row.className = "msg-row";
      const bubble = document.createElement("div");
      bubble.className = "msg-user";
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesInner.appendChild(row);
      messagesScroll.scrollTop = messagesScroll.scrollHeight;
    }

    function appendBotMessage(text, isError = false) {
      removeGreeting();
      const row = document.createElement("div");
      row.className = "msg-row";
      const bubble = document.createElement("div");
      bubble.className = isError ? "msg-error" : "msg-bot";
      bubble.textContent = text;
      row.appendChild(bubble);

      if (!isError) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "copy-btn";
        copyBtn.textContent = "Copier";
        copyBtn.addEventListener("click", async () => {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "Copié ✓";
          setTimeout(() => (copyBtn.textContent = "Copier"), 1400);
        });
        actions.appendChild(copyBtn);
        row.appendChild(actions);
      }

      messagesInner.appendChild(row);
      messagesScroll.scrollTop = messagesScroll.scrollHeight;
    }

    function showLoader() {
      removeGreeting();
      const row = document.createElement("div");
      row.className = "msg-row";
      row.id = "loadingRow";
      row.innerHTML = `<div class="dots"><span></span><span></span><span></span></div>`;
      messagesInner.appendChild(row);
      messagesScroll.scrollTop = messagesScroll.scrollHeight;
    }

    function hideLoader() {
      const row = document.getElementById("loadingRow");
      if (row) row.remove();
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = promptInput.value.trim();
      if (!message) return;

      appendUserMessage(message);
      promptInput.value = "";
      promptInput.style.height = "auto";
      sendBtn.disabled = true;
      showLoader();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            language: state.language,
            skill: state.skill,
            message,
            history: state.history
          })
        });
        const data = await res.json();
        hideLoader();

        if (res.status === 401) {
          showLogin("Session expirée, reconnecte-toi avec Google.");
          initGoogleSignIn();
          return;
        }

        if (!res.ok) {
          appendBotMessage(data.error || `Erreur (${res.status})`, true);
          return;
        }

        const reply = data.reply || "Aucune réponse.";
        appendBotMessage(reply, false);
        state.history.push({ role: "user", content: message });
        state.history.push({ role: "assistant", content: reply });
      } catch (err) {
        hideLoader();
        appendBotMessage("Erreur réseau : " + err.message, true);
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    });

    checkSession();
  </script>
</body>
</html>
