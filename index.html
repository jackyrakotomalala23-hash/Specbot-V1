<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specbot — ADM Value × ManoMano</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #131314;
      --sidebar: #1b1c1d;
      --surface: #1e1f20;
      --surface-elevated: #26282b;
      --surface-hover: #2c2e31;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #e3e3e3;
      --text-strong: #ffffff;
      --muted: #9aa0a6;
      --accent: #a8c7fa;
      --accent-ink: #062e6f;
      --accent-soft: rgba(168, 199, 250, 0.13);
      --accent-bg: rgba(168, 199, 250, 0.18);
      --user-bubble: #282a2c;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      --danger: #f28b82;
      --gradient-title: linear-gradient(120deg, #a8c7fa 0%, #c58af9 55%, #8ab4f8 100%);
    }

    html[data-theme="light"] {
      --bg: #f8fafd;
      --sidebar: #f0f4f9;
      --surface: #ffffff;
      --surface-elevated: #f3f6fc;
      --surface-hover: #e7edf6;
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.15);
      --text: #1f1f1f;
      --text-strong: #0b0d12;
      --muted: #5f6368;
      --accent: #0b57d0;
      --accent-ink: #ffffff;
      --accent-soft: rgba(11, 87, 208, 0.09);
      --accent-bg: #d3e3fd;
      --user-bubble: #e9eef6;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      --danger: #b3261e;
      --gradient-title: linear-gradient(120deg, #0b57d0 0%, #5e35b1 60%, #1a73e8 100%);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Google Sans", "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Login screen */
    .login-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 18px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: riseIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 600;
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 23px;
      font-weight: 600;
      color: var(--text-strong);
    }

    .login-card p {
      margin: 0 0 26px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.55;
    }

    .google-btn-wrap {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    .login-notice {
      margin-top: 14px;
      font-size: 13px;
      color: var(--accent);
      min-height: 18px;
    }

    .login-error {
      margin-top: 8px;
      font-size: 13px;
      color: var(--danger);
      min-height: 18px;
    }

    /* App Shell */
    .app {
      display: none;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .app.active {
      display: flex;
    }

    .sidebar {
      width: 282px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      gap: 16px;
      flex-shrink: 0;
      overflow: hidden;
      transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  padding 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.2s ease,
                  background-color 0.25s ease;
    }

    .sidebar.collapsed {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-right: none;
      opacity: 0;
      pointer-events: none;
    }

    .new-chat-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-strong);
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .new-chat-btn:hover {
      background: var(--surface-hover);
      transform: translateY(-1px);
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
      padding-left: 8px;
      white-space: nowrap;
    }

    .skill-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .skill-item {
      border: none;
      background: transparent;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 12px;
      text-align: left;
      font-size: 13.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      white-space: nowrap;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .skill-item:hover {
      background: var(--surface-hover);
    }

    .skill-item.active {
      background: var(--accent-bg);
      color: var(--text-strong);
      font-weight: 500;
    }

    .skill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.16s ease;
    }

    .skill-item.active .skill-dot {
      opacity: 1;
    }

    .lang-select {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13.5px;
      outline: none;
      cursor: pointer;
    }

    .lang-select:focus {
      border-color: var(--accent);
    }

    /* Conversation History in Sidebar */
    .history-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-right: 2px;
    }

    .history-empty {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 10px;
      font-style: italic;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: background 0.15s ease;
    }

    .history-item:hover {
      background: var(--surface-hover);
    }
